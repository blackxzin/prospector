# Textos para Portugal (português europeu). Sobrescreve o templates.yaml (pt do Brasil).
idioma: pt-PT
decimal: ","
apresentacao: "Sou programador brasileiro e, com o meu sócio Felipe, fazemos sites, automatismos e bots de atendimento para WhatsApp."
portfolio: ""
optout: "(Se preferir não receber mais mensagens, responda PARAR e não volto a contactar.)"
problema_padrao: "não carregava bem"
saudacoes: {manha: "Bom dia", tarde: "Boa tarde", noite: "Boa noite"}

elogios_com_nota:
  - "Uma nota de {nota} com {avaliacoes} avaliações no Google é um excelente resultado, parabéns."
  - "Têm {nota} estrelas e {avaliacoes} avaliações no Google, muito bem!"
  - "Encontrei-os no Google Maps, {nota} de nota e {avaliacoes} avaliações, ótimo trabalho."
elogios_sem_nota:
  - "Encontrei-os no Google Maps."
  - "Vi o vosso perfil no Google Maps."
  - "Descobri o vosso negócio no Google Maps."

vitrine:
  padrao: "os vossos serviços"
  por_categoria:
    - palavras: [cabeleireir, barbear, barbeir, salao, estetica, beleza, unhas, manicure, spa, cosmet, pestanas, tatuag]
      texto: "os vossos serviços e preços"
    - palavras: [pizza, restaurante, hamburg, cafe, padaria, pastelaria, gelat, bar, tasca, marisqueira, sushi, snack, churrasqueira, tapas]
      texto: "a vossa ementa"
    - palavras: [ginasio, fitness, crossfit, pilates, yoga, boxe, danca, artes marciais]
      texto: "as vossas aulas e horários"
    - palavras: [loja, boutique, roupa, animais, florista, presentes]
      texto: "os vossos produtos"

primeira:
  sem_site:
    - "{saudacao}, {nome}! Chamo-me {remetente}. {apresentacao} {elogio} Procurei o vosso site e não o encontrei. Se ainda não têm um, fazemos um site simples, com {vitrine} e um botão que abre diretamente o WhatsApp. Teriam interesse em ver um exemplo, sem compromisso? {optout}"
    - "{saudacao}! Fala {remetente}. {apresentacao} {elogio} Não encontrei um site de {nome} no Google. Se for esse o caso, fazemos páginas rápidas e cuidadas com {vitrine} e botão de WhatsApp. Posso enviar-vos um exemplo? {optout}"
    - "Olá, {nome}! Sou o {remetente}. {apresentacao} {elogio} O vosso perfil do Google não tem site associado. Podemos criar um simples, com {vitrine} e um botão de WhatsApp para os clientes falarem convosco com um toque. Querem ver um exemplo? {optout}"
  so_social:
    - "{saudacao}, {nome}! Chamo-me {remetente}. {apresentacao} {elogio} Encontrei as vossas redes sociais, mas não um site próprio. Uma página simples com {vitrine} e botão de WhatsApp ajuda também a aparecer no Google. Teriam interesse em ver um exemplo? {optout}"
    - "{saudacao}! Fala {remetente}. {apresentacao} {elogio} Neste momento o link do Google leva apenas às redes sociais. Fazemos sites rápidos com {vitrine} e botão de WhatsApp. Posso enviar-vos um exemplo? {optout}"
    - "Olá, {nome}! Sou o {remetente}. {apresentacao} {elogio} Reparei que não têm site próprio, só redes sociais. Podemos montar uma página limpa com {vitrine} e um botão para o WhatsApp. Interessa-vos um exemplo? {optout}"
  tem_site:
    - "{saudacao}, {nome}! Chamo-me {remetente}. {apresentacao} {elogio} Vi que já têm site, ótimo! Fazemos também bots de atendimento no WhatsApp: respondem às dúvidas comuns, mostram {vitrine} e passam-vos os pedidos ou reservas. Gostariam de ver um exemplo? {optout}"
    - "{saudacao}! Fala {remetente}. {apresentacao} {elogio} Um bot de WhatsApp evita que alguém fique sem resposta nas horas de maior movimento. Posso mostrar-vos um exemplo? {optout}"
    - "Olá, {nome}! Sou o {remetente}. {apresentacao} {elogio} Automatizamos o WhatsApp: mensagem de boas-vindas, respostas prontas e passagem da conversa para vocês quando é importante. Interessa-vos um exemplo? {optout}"
  site_problema:
    - "{saudacao}, {nome}! Chamo-me {remetente}. {apresentacao} {elogio} Experimentei o vosso site e {problema}. Isso faz com que os clientes desistam antes de vos contactar. Podemos resolver ou criar um novo, rápido, com {vitrine} e botão de WhatsApp. Querem ver um exemplo? {optout}"
    - "{saudacao}! Fala {remetente}. {apresentacao} {elogio} Visitei o vosso site e {problema}. Como muita gente procura primeiro no Google, vale a pena resolver. Posso enviar-vos um exemplo? {optout}"
    - "Olá, {nome}! Sou o {remetente}. {apresentacao} {elogio} Um aviso rápido: o vosso site {problema}. Fazemos sites novos e leves com {vitrine} e botão de WhatsApp. Interessa-vos um exemplo? {optout}"

followup:
  - "Olá, {nome}! Só para saber se viram a minha mensagem. Se agora não fizer sentido, sem problema. Posso enviar o exemplo? {optout}"
  - "{saudacao}! Sei que a rotina é intensa, por isso só volto a escrever esta vez. Querem que envie o exemplo? {optout}"
  - "Olá de novo, {nome}! Última mensagem da minha parte. Se quiserem ver o exemplo, digam-me por aqui. {optout}"

fora_do_horario:
  - "Olá! Obrigado pela resposta. Neste momento estou fora de horas, mas respondo no próximo dia útil."
  - "Obrigado por responder! Já terminei por hoje, mas respondo no próximo dia útil."
  - "Recebi a vossa mensagem, obrigado. Estou fora de horas e respondo no próximo dia útil."
