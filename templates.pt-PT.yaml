# Textos para Portugal (português europeu). Sobrescreve o templates.yaml (pt do Brasil).
idioma: pt-PT
decimal: ","
quem: "Eu e o Felipe somos programadores brasileiros."
apresentacao: ""
portfolio: ""
optout: "(Respondam PARAR e não volto a escrever.)"
problema_padrao: "não carregava bem"
saudacoes: {manha: "Bom dia", tarde: "Boa tarde", noite: "Boa noite"}

elogios_com_nota:
  - "Uma nota de {nota} com {avaliacoes} avaliações no Google é um excelente resultado, parabéns."
  - "Têm {nota} estrelas e {avaliacoes} avaliações no Google, muito bem!"
  - "Encontrei-os no Google Maps, {nota} de nota e {avaliacoes} avaliações, ótimo trabalho."
elogios_sem_nota:
  - "Encontrei-os no Google Maps."
  - "Vi o vosso perfil no Google Maps."
  - "Descobri o vosso negócio no Google Maps."

vitrine:
  padrao: "os vossos serviços"
  por_categoria:
    - palavras: [cabeleireir, barbear, barbeir, salao, estetica, beleza, unhas, manicure, spa, cosmet, pestanas, tatuag]
      texto: "os vossos serviços e preços"
    - palavras: [pizza, restaurante, hamburg, cafe, padaria, pastelaria, gelat, bar, tasca, marisqueira, sushi, snack, churrasqueira, tapas]
      texto: "a vossa ementa"
    - palavras: [ginasio, fitness, crossfit, pilates, yoga, boxe, danca, artes marciais]
      texto: "as vossas aulas e horários"
    - palavras: [loja, boutique, roupa, animais, florista, presentes]
      texto: "os vossos produtos"

# Abordagem curta: gancho real do lead, uma pergunta simples e pedido de "com quem falo". Sem link e sem preço.
primeira:
  sem_site:
    - "{saudacao}! Sou o Lucas. {quem} Procurei {nome} no Google e não encontrei site. Com quem posso falar sobre isso? {optout}"
    - "Olá, sou o Lucas. {quem} Quando alguém pesquisa o vosso negócio no Google, aparece só o mapa, sem site. Já foi assunto por aí? Quem trata dessa parte? {optout}"
    - "{saudacao}! Sou o Lucas. {quem} Tenho uma ideia simples para {nome} aparecer melhor no Google. Posso explicá-la rapidamente a quem decide? {optout}"
    - "Olá, sou o Lucas. {quem} Vi-vos no Google com nota {nota_boa}, mas sem site. Já pensaram em ter um? Com quem posso falar? {optout}"
    - "{saudacao}! Sou o Lucas. {quem} Li o que um cliente escreveu sobre vós no Google: “{avaliacao}”. Mas não encontrei site. Quem trata disso? {optout}"
  so_social:
    - "{saudacao}! Sou o Lucas. {quem} Cheguei às vossas redes sociais pelo Google. Têm também site ou só as redes? {optout}"
    - "Olá, sou o Lucas. {quem} Reparei que {nome} divulga só nas redes sociais. Já pensaram num site simples com botão de WhatsApp? Com quem posso falar sobre isso? {optout}"
    - "{saudacao}! Sou o Lucas. {quem} Quem trata da divulgação? Tenho uma ideia rápida para quem vos procura no Google chegar direto ao WhatsApp. Posso explicá-la a quem decide? {optout}"
    - "Olá, sou o Lucas. {quem} Vi o vosso {arroba}, muito bom! Só não encontrei site. Já pensaram em ter um? Com quem posso falar? {optout}"
    - "{saudacao}! Sou o Lucas. {quem} Li uma avaliação de um cliente no Google: “{avaliacao}”. Quem vos procura só encontra redes sociais. Quem trata disso? {optout}"
  tem_site:
    - "{saudacao}! Sou o Lucas. {quem} Quando um cliente vos escreve no WhatsApp fora de horas, alguém responde ou fica para o dia seguinte? {optout}"
    - "Olá, sou o Lucas. {quem} Vi o vosso site. O WhatsApp é por onde chegam mais pedidos? Faço respostas automáticas que atendem na hora. Posso explicar a quem trata disso? {optout}"
    - "{saudacao}! Sou o Lucas. {quem} Há alguém no WhatsApp o dia todo ou o movimento é demasiado? Tenho uma ideia para aliviar. Com quem posso falar? {optout}"
    - "{saudacao}! Sou o Lucas. {quem} Li uma avaliação de um cliente: “{avaliacao}”. Em dias cheios, conseguem responder a todos no WhatsApp? Com quem posso falar sobre isso? {optout}"
  site_problema:
    - "{saudacao}! Sou o Lucas. {quem} Tentei abrir o vosso site e {problema}. Sabiam? Com quem posso falar para ajudar a resolver? {optout}"
    - "Olá, sou o Lucas. {quem} Passei pelo vosso site e {problema}. Isso faz os clientes desistirem. Quem trata do site? {optout}"
    - "{saudacao}! Sou o Lucas. {quem} Aviso rápido: ao abrir o vosso site, {problema}. Posso ajudar a resolver. Com quem falo? {optout}"

followup:
  - "Olá! Só para saber se a minha mensagem chegou. Se não for consigo, indicam-me quem trata disto? {optout}"
  - "{saudacao}! Sei que a rotina é intensa. Se houver alguém que trate do site ou do WhatsApp, passam-me o contacto para falar diretamente? {optout}"
  - "Olá! Última mensagem, não insisto. Se um dia quiserem ver o que faço, escrevam-me por aqui. Muito sucesso! {optout}"

fora_do_horario:
  - "Olá! Obrigado pela resposta. Neste momento estou fora de horas, mas respondo no próximo dia útil."
  - "Obrigado por responder! Já terminei por hoje, mas respondo no próximo dia útil."
  - "Recebi a vossa mensagem, obrigado. Estou fora de horas e respondo no próximo dia útil."
