# Sites de exemplo: um visual e um conteúdo para cada nicho.
#
# O nicho é escolhido pela CATEGORIA do Google Maps (e, se nada bater, pelo nome do negócio),
# testando as palavras de "match" na ordem deste arquivo. O primeiro que bater vence.
#
# Tudo aqui é editável: cores, fontes (Google Fonts), textos, cardápio, planos e serviços.
# Preços são ilustrativos: a página avisa isso no topo.
#
# arte: pizza | burger | esfiha | acai | padaria | prato | halter | barbearia | salao | pet | geral
# secao.tipo: cardapio (lista com grupos) | planos (cartões de preço) | servicos (lista com duração)

pizzaria:
  match: [pizza]
  arte: pizza
  fontes: {display: "Fraunces", corpo: "Inter", google: "family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600;700"}
  tema: {bg: "#fbf5ec", surface: "#ffffff", ink: "#2a1a12", muted: "#7a6556", accent: "#c8361f", accent_ink: "#ffffff", accent2: "#2f7d4f", line: "#efe3d3", hero: "#f6e7d3"}
  frase: "Massa leve, molho de verdade e borda caprichada."
  sub: "Peça pelo WhatsApp e receba quentinha em casa."
  botao: "Pedir pelo WhatsApp"
  ticker: [Calabresa, Marguerita, Portuguesa, Frango com catupiry, Quatro queijos, Chocolate, Pepperoni, Napolitana]
  destaques:
    - {icone: fogo, titulo: "Saindo do forno", texto: "Pedido feito, pizza no forno. Sem esperar app."}
    - {icone: moto, titulo: "Entrega na cidade", texto: "Chega quentinha, com a borda crocante."}
    - {icone: chat, titulo: "Pedido em 1 minuto", texto: "Escolha aqui e mande no WhatsApp."}
  secao:
    tipo: cardapio
    titulo: "Cardápio"
    grupos:
      - nome: "Tradicionais"
        itens:
          - [Mussarela, "Molho de tomate, mussarela e orégano", "R$ 44,90"]
          - [Calabresa, "Calabresa fatiada, cebola e azeitona", "R$ 49,90"]
          - [Marguerita, "Mussarela, tomate e manjericão fresco", "R$ 49,90"]
          - [Portuguesa, "Presunto, ovo, cebola, ervilha e mussarela", "R$ 54,90"]
      - nome: "Especiais"
        itens:
          - [Frango com catupiry, "Frango desfiado temperado e catupiry", "R$ 54,90"]
          - [Quatro queijos, "Mussarela, provolone, parmesão e catupiry", "R$ 57,90"]
          - [Pepperoni, "Pepperoni fatiado e mussarela", "R$ 59,90"]
      - nome: "Doces"
        itens:
          - [Chocolate, "Chocolate ao leite e granulado", "R$ 47,90"]
          - [Romeu e Julieta, "Goiabada cremosa e mussarela", "R$ 47,90"]

