# Nichos para testar, um por dia. Cada nicho tem: o que buscar no Google Maps, como reconhecê-lo (palavras da
# categoria do Maps ou da busca, sem acento) e a "dor" (pergunta curta usada nas mensagens desse nicho).
# `ordem` + `inicio`: cada dia útil (seg a sex) foca um nicho, na ordem, e depois recomeça.
# Rode `prospector nichos` para ver o resultado de cada um (enviadas, respostas de gente de verdade, interesse).

inicio: 2026-10-21
ordem: [clinicas, mecanicos, corretores, saloes, advogados, contabilidade, academias, pets, lojas]

nichos:
  clinicas:
    nome: Clínicas e consultórios
    buscas: [dentista, clínica odontológica, psicólogo, fisioterapia, nutricionista, clínica de estética]
    categorias: [dentista, odonto, psicolog, fisioterap, nutricion, clinica, consultorio, medic, ortodont, fonoaudi]
    dor: "Quando um paciente chama no WhatsApp pra marcar horário fora do expediente, alguém responde ou ele procura outra clínica?"
  mecanicos:
