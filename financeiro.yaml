# Financeiro do prospector. Edite os valores com os SEUS preços.
# Valores em reais (use ponto para centavos: 599.90).

# Meta de faturamento por mês (recebido), usada no painel e nas sugestões.
meta_mensal: 3000

# Preços padrão que aparecem pré-preenchidos ao confirmar um fechamento.
# Política do Lucas: só falar preço se o cliente perguntar. Pacote completo (site e tudo mais):
# "de R$ 2.000 por R$ 997" + R$ 147 por mês (oferta de lançamento do portfólio-dupla.vercel.app).
# Dá para mudar caso a caso no painel.
precos:
  site:
    descricao: "Site simples com cardápio/planos e botão de WhatsApp"
    valor: 997
    custo_estimado: 60      # domínio, hospedagem do 1º ano etc.
    mensalidade: 147          # manutenção mensal (0 = sem mensalidade)
    prazo_dias: 7
    inclui:                 # vai na proposta em PDF (igual à oferta do portfólio)
      - "Site profissional feito sob medida para o seu negócio"
      - "Layout que funciona no celular, tablet e computador"
      - "Botão de WhatsApp para o cliente falar com você em um toque"
      - "Estrutura pronta para aparecer no Google"
      - "Domínio próprio e cadeado de segurança (HTTPS)"
      - "Mensalidade: hospedagem, manutenção, ajustes de texto e fotos e suporte direto"
  automacao:
    descricao: "Automação de atendimento no WhatsApp"
    valor: 997
    custo_estimado: 0
    mensalidade: 147
    prazo_dias: 10
    inclui:
      - "Mensagem de boas-vindas e menu automático no WhatsApp"
      - "Respostas prontas para as dúvidas mais comuns (preço, horário, entrega)"
      - "Encaminhamento do pedido para a equipe"
      - "Ajustes durante o primeiro mês"

# Qual serviço cada oferta vira quando fecha.
oferta_para_tipo:
  sem_site: site
  so_social: site
  tem_site: automacao
  site_problema: site

# Como o valor é cobrado: entrada no fechamento e o resto na entrega (prazo).
entrada_percentual: 50

# Categorias de despesa disponíveis no painel.
categorias_despesa: [dominio, hospedagem, ferramenta, anuncio, transporte, imposto, outro]
