# Textos dos canais alternativos: e-mail (enviado pelo sistema) e DM do Instagram (você cola e envia).
# Variáveis: {saudacao} {saudacao_minuscula} {nome} {quem} {portfolio} {assinatura} {optout} {arroba}
# Sem preço: valores só se o lead perguntar. Sem cidade: só "Campinas e região" (em {quem}).
#
# O texto é gerado no 'montar' e fica gravado na fila; o envio pode sair horas depois. Por isso os textos
# abrem com "Olá"/"Oi" em vez de {saudacao} ("Bom dia" montado de manhã chegaria à tarde).
# Evite artigo antes de {nome} ("a {nome}", "da {nome}"): não dá para saber o gênero. Use "vocês" ou sem artigo.

quem: "Sou o Lucas. Eu e o Felipe somos uma dupla de desenvolvedores de Campinas e região"
portfolio: "https://portifolio-dupla.vercel.app"
assinatura: "Lucas e Felipe"
optout: "Se preferir não receber mais mensagens nossas, é só responder \"parar\" que não enviamos mais."

email:
  tem_site:
    - assunto: "{nome}: uma ideia para o site"
      texto: |
        Olá, tudo bem?

        {quem}. Vi o site de vocês e tive uma ideia simples para ele trazer mais contatos: um atendimento automático no WhatsApp, que responde na hora e só passa para a equipe o que importa.

        Posso explicar em poucas linhas? Nossos trabalhos: {portfolio}

        Abraço,
        {assinatura}

        {optout}
    - assunto: "{nome}: cliente fora do horário"
      texto: |
        Olá, tudo bem?

        {quem}. Fazemos sites e atendimento automático por WhatsApp para pequenos negócios.

        Uma pergunta rápida: quando um cliente chama fora do horário, alguém responde ou fica para o dia seguinte? Temos uma solução simples para isso.

        Nossos trabalhos: {portfolio}

        Abraço,
        {assinatura}

        {optout}
  site_problema:
    - assunto: "{nome}: vi um problema no site"
      texto: |
        Olá, tudo bem?

        {quem}. Procurando vocês no Google, reparei num problema no site que pode estar fazendo cliente desistir. Posso mandar o que vi e como resolver, sem compromisso?

        Nossos trabalhos: {portfolio}

        Abraço,
        {assinatura}

        {optout}
  padrao:
    - assunto: "Uma ideia para {nome}"
      texto: |
        Olá, tudo bem?

        {quem}. Fazemos sites e atendimento automático por WhatsApp para pequenos negócios, e encontramos vocês no Google.

        Posso explicar em poucas linhas como isso ajudaria no dia a dia de vocês? Nossos trabalhos: {portfolio}

        Abraço,
        {assinatura}

        {optout}

# Lembrete único, 3 dias úteis depois, só para quem não respondeu. O assunto vira "Re: <assunto original>".
email_followup:
  - |
    Olá, tudo bem?

    Passando só para retomar meu e-mail anterior. {quem}. Se fizer sentido conversar sobre atendimento automático no WhatsApp ou o site de vocês, é só responder aqui. Nossos trabalhos: {portfolio}

    Se não for o momento, sem problema.

    Abraço,
    {assinatura}

    {optout}
  - |
    Olá!

    Voltando ao meu e-mail da semana passada, caso tenha passado batido. {quem}. Posso explicar em poucas linhas como ajudaria vocês, sem compromisso. Nossos trabalhos: {portfolio}

    Abraço,
    {assinatura}

    {optout}

instagram:
  so_social:
    - "Oi, tudo bem? {quem}. Vi o perfil de vocês e curti. Hoje os clientes chamam mais por aqui ou pelo WhatsApp? Tenho uma ideia simples pra facilitar os pedidos."
    - "Oi! {quem}. Fiquei curioso vendo o perfil de vocês: o cliente consegue resolver tudo por aqui ou precisaria de um site ou atendimento no WhatsApp? Posso mostrar uma ideia rápida."
    - "Olá! {quem}. Tenho uma ideia pra transformar o perfil de vocês em mais contatos, sem trabalho extra pra equipe. Posso explicar rapidinho?"
  padrao:
    - "Oi, tudo bem? {quem}. Fazemos sites e atendimento automático no WhatsApp para pequenos negócios. Posso explicar em 2 linhas como isso ajudaria vocês?"

# Sugestões de texto para o follow-up de conversas em andamento (você manda à mão, pelo painel Follow-up).
# {chamada} vira ", Juliana" (nome do contato) ou fica vazio.
acompanhamento:
  interessado:
    - "Oi{chamada}, tudo bem? Conseguiu dar uma olhada no que te mandei? Se quiser mudar alguma coisa, é só falar."
    - "Oi{chamada}! Passando pra saber o que achou. Posso ajustar o que você preferir, sem compromisso."
    - "Oi{chamada}, tudo bem? Ficou alguma dúvida? Se preferir, a gente combina uma conversa rápida no horário que for melhor pra você."
  respondeu:
    - "Oi{chamada}, tudo bem? Retomando nossa conversa: ficou alguma dúvida sobre o que combinamos?"
    - "Oi{chamada}! Só passando pra saber se faz sentido a gente conversar sobre isso agora ou se prefere em outro momento."
