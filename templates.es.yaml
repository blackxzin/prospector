# Textos em espanhol (Espanha). Sobrescreve o templates.yaml (pt).
idioma: es
decimal: ","
quem: "Mi socio Felipe y yo somos desarrolladores de Brasil."
apresentacao: ""
portfolio: ""
optout: "(Respondan STOP y no volveré a escribirles.)"
problema_padrao: "no cargaba bien"
saudacoes: {manha: "Buenos días", tarde: "Buenas tardes", noite: "Buenas noches"}

elogios_com_nota:
  - "Una nota de {nota} con {avaliacoes} reseñas en Google es un gran resultado, enhorabuena."
  - "Tienen {nota} estrellas y {avaliacoes} reseñas en Google, ¡muy bien!"
  - "Los encontré en Google Maps, {nota} de nota y {avaliacoes} reseñas, un trabajo excelente."
elogios_sem_nota:
  - "Los encontré en Google Maps."
  - "Vi su perfil en Google Maps."
  - "Encontré su negocio en Google Maps."

vitrine:
  padrao: "sus servicios"
  por_categoria:
    - palavras: [peluquer, barber, salon, estetica, belleza, unas, manicura, spa, cosmet, pestan, tatuaj]
      texto: "sus servicios y precios"
    - palavras: [pizza, restaurante, hamburgues, cafeteria, cafe, panaderia, heladeria, comida, bar, tapas, asador, sushi, tacos, bocadill, pasteleria]
      texto: "su carta"
    - palavras: [gimnasio, fitness, crossfit, pilates, yoga, artes marciales, boxeo, danza, baile]
      texto: "sus clases y horarios"
    - palavras: [tienda, boutique, ropa, mascota, floristeria, regalos, ferreteria]
      texto: "sus productos"

# Abordagem curta: gancho real do lead, uma pergunta simples e pedido de "com quem falo". Sem link e sem preço.
primeira:
  sem_site:
    - "{saudacao}. Soy Lucas. {quem} Busqué {nome} en Google y no encontré su web. ¿Con quién puedo hablar de esto? {optout}"
    - "Hola, soy Lucas. {quem} Cuando alguien busca su negocio en Google hoy, solo aparece el mapa, sin web. ¿Ya lo han hablado alguna vez? ¿Quién se encarga de esa parte? {optout}"
    - "{saudacao}. Soy Lucas. {quem} Tengo una idea sencilla para que {nome} aparezca mejor en Google. ¿Puedo explicársela rápidamente a quien decide esto? {optout}"
    - "Hola, soy Lucas. {quem} Los vi en Google con nota {nota_boa}, pero sin web. ¿Han pensado en tener una? ¿Con quién puedo hablar? {optout}"
    - "{saudacao}. Soy Lucas. {quem} Leí lo que escribió un cliente suyo en Google: “{avaliacao}”. Pero no encontré su web. ¿Quién se encarga de eso? {optout}"
  so_social:
    - "{saudacao}. Soy Lucas. {quem} Llegué a sus redes sociales a través de Google. ¿Tienen también una web o solo las redes? {optout}"
    - "Hola, soy Lucas. {quem} Vi que {nome} se promociona solo en redes sociales. ¿Han pensado en una web sencilla con botón de WhatsApp? ¿Con quién puedo hablar de eso? {optout}"
    - "{saudacao}. Soy Lucas. {quem} ¿Quién lleva la promoción de ustedes? Tengo una idea rápida para que quien los busque en Google llegue directo a su WhatsApp. ¿Puedo explicársela a quien decide? {optout}"
    - "Hola, soy Lucas. {quem} Vi su {arroba}, ¡muy bueno! Pero no encontré una web. ¿Han pensado en tener una? ¿Con quién puedo hablar? {optout}"
    - "{saudacao}. Soy Lucas. {quem} Leí una reseña de un cliente en Google: “{avaliacao}”. Quien los busca solo encuentra redes sociales. ¿Quién se encarga de eso? {optout}"
  tem_site:
    - "{saudacao}. Soy Lucas. {quem} Cuando un cliente les escribe por WhatsApp fuera de horario, ¿alguien responde o queda para el día siguiente? {optout}"
    - "Hola, soy Lucas. {quem} Vi su web. ¿Es por WhatsApp por donde más llegan consultas? Hago respuestas automáticas que contestan al instante. ¿Puedo explicárselo a quien lo gestiona? {optout}"
    - "{saudacao}. Soy Lucas. {quem} ¿Alguien atiende el WhatsApp todo el día o hay demasiado movimiento para eso? Tengo una idea para aligerar. ¿Con quién puedo hablar? {optout}"
    - "{saudacao}. Soy Lucas. {quem} Leí una reseña de un cliente suyo: “{avaliacao}”. En un día de mucho trabajo, ¿dan abasto para responder a todos por WhatsApp? ¿Con quién hablo de esto? {optout}"
  site_problema:
    - "{saudacao}. Soy Lucas. {quem} Intenté abrir su web y {problema}. ¿Lo sabían? ¿Con quién puedo hablar para ayudar a solucionarlo? {optout}"
    - "Hola, soy Lucas. {quem} Pasé por su web y {problema}. Eso hace que los clientes se vayan. ¿Quién se encarga de la web? {optout}"
    - "{saudacao}. Soy Lucas. {quem} Un aviso rápido: al abrir su web, {problema}. Puedo ayudar a arreglarlo. ¿Con quién hablo? {optout}"

followup:
  - "Hola. Solo quería saber si les llegó mi mensaje. Si no es con ustedes, ¿me indicarían quién se encarga de esto? {optout}"
  - "{saudacao}. Sé que hay mucho trabajo. Si alguien se ocupa de su web o del WhatsApp, ¿me pasarían su contacto para hablar directamente? {optout}"
  - "Hola. Último mensaje, no insistiré. Si algún día quieren ver lo que hago, escríbanme por aquí. ¡Mucho éxito! {optout}"

fora_do_horario:
  - "¡Hola! Gracias por responder. Ahora mismo estoy fuera de horario, pero les contesto el próximo día laborable."
  - "¡Gracias por contestar! Ya terminé por hoy, pero les respondo el próximo día laborable."
  - "Recibí su mensaje, gracias. Estoy fuera de horario y respondo el próximo día laborable."
