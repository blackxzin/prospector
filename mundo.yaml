# Buscas fora do Brasil (`prospector lote --mundo`). Cada país tem idioma, fuso e cidades; os nichos vêm por
# idioma (a busca é feita na língua do lugar). Combinações já feitas ficam registradas e são puladas.
# Países onde WhatsApp é forte: Espanha, Itália, Portugal, Reino Unido, Alemanha, Países Baixos, Irlanda.
# EUA e Canadá usam pouco WhatsApp (SMS/iMessage): muitos números não terão conta.

max_por_execucao: 8

# Como montar a busca em cada idioma: "{nicho} {prep} {cidade}, {pais}"
idiomas:
  en: {prep: "in"}
  es: {prep: "en"}
  fr: {prep: "à"}
  de: {prep: "in"}
  it: {prep: "a"}
  pt-PT: {prep: "em"}

nichos:
  en: [pizza restaurant, hamburger restaurant, barber shop, hair salon, bakery, cafe, restaurant, ice cream shop,
       gym, auto repair shop, pet shop, nail salon, beauty salon, food truck]
  es: [pizzería, hamburguesería, barbería, peluquería, panadería, cafetería, restaurante, heladería, gimnasio,
       taller mecánico, tienda de mascotas, salón de uñas, centro de estética]
  fr: [pizzeria, restaurant de hamburgers, barbier, salon de coiffure, boulangerie, café, restaurant, glacier,
       salle de sport, garage automobile, animalerie, onglerie, institut de beauté]
  de: [Pizzeria, Burgerrestaurant, Barbershop, Friseursalon, Bäckerei, Café, Restaurant, Eisdiele, Fitnessstudio,
       Autowerkstatt, Tierhandlung, Nagelstudio, Kosmetikstudio]
  it: [pizzeria, hamburgeria, barbiere, parrucchiere, panetteria, caffè, ristorante, gelateria, palestra,
       officina meccanica, negozio di animali, nail salon, centro estetico]
  pt-PT: [pizzaria, hamburgueria, barbearia, cabeleireiro, padaria, café, restaurante, gelataria, ginásio,
       oficina, loja de animais, unhas de gel, centro de estética]

