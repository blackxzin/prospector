# Templates de mensagem do prospector. Edite à vontade.
#
# Variáveis disponíveis em qualquer texto:
#   {saudacao}   "Bom dia" / "Boa tarde" / "Boa noite" (pelo horário local); {saudacao_minuscula} idem, minúsculo
#   {nome}       nome do negócio, limpo (sem " - Delivery", " | Centro" etc.)
#   {remetente}  seu nome (definido abaixo; também assina a proposta em PDF)
#   {apresentacao} frase que apresenta vocês (definida abaixo)
#   {portfolio}  link do portfólio (definido abaixo)
#   {elogio}     frase sobre a nota no Google (ou frase neutra, se não houver nota boa)
#   {nota}       ex.: 4,7          {avaliacoes}  ex.: 132
#   {vitrine}    "o cardápio" / "os planos e horários" / "os serviços" (pela categoria)
#   {problema}   (só em site_problema) ex.: "o site está fora do ar"
#   {valor} {vencimento} {descricao} {pix}   (só em cobranca)
#
# Teste A/B: cada variação de "primeira" é medida (taxa de resposta positiva) e as que
# funcionam melhor passam a ser sorteadas com mais frequência. Ver em `prospector ab`.
#
# Dica: evite artigo antes de {nome} ("o {nome}", "a {nome}"): não dá para saber o gênero.
# Use o nome no vocativo ("{saudacao}, {nome}!") ou sem artigo.

remetente: "Lucas"
portfolio: "https://portifolio-dupla.vercel.app"
apresentacao: "Eu e o Felipe somos desenvolvedores aqui da região e fazemos sites, automações e bots de atendimento para WhatsApp. Dá pra ver nossos trabalhos em {portfolio}."

# Nota mínima e número mínimo de avaliações para elogiar a nota.
elogio_nota_minima: 4.0
elogio_avaliacoes_minimas: 10

elogios_com_nota:
  - "Vocês têm nota {nota} com {avaliacoes} avaliações no Google, mandaram bem!"
  - "{nota} de nota e {avaliacoes} avaliações no Google não é pouca coisa, parabéns."
  - "Achei vocês no Google Maps, nota {nota} com {avaliacoes} avaliações, muito bom."

elogios_sem_nota:
  - "Achei vocês no Google Maps."
  - "Encontrei vocês pelo Google Maps."
  - "Vi o perfil de vocês no Google Maps."

vitrine:
  padrao: "os serviços"
  por_categoria:
    # barbearia antes da comida: "bar" da lista de comida casaria com "barbearia"
    - palavras: [salão, salao, barbearia, beleza, estética, estetica, manicure, cabeleireiro, sobrancelha]
      texto: "os serviços e preços"
    - palavras: [pizza, restaurante, lanch, hamburg, esfih, burger, açaí, acai, sorvete, padaria, confeitaria, doceria, bar, café, cafe, marmita, comida, delivery, esfiha, sushi, japon, churrasc, pastel]
      texto: "o cardápio"
    - palavras: [academia, fitness, crossfit, pilates, musculação, musculacao, studio, estúdio, funcional, natação, natacao, luta, jiu, muay]
      texto: "os planos e horários"
    - palavras: [loja, cosmético, cosmetico, roupa, moda, calçado, calcado, presente, papelaria, ótica, otica, pet shop]
      texto: "os produtos"

# Abordagem curta (WhatsApp de negócio costuma ser atendido por funcionário ou robô, não pelo dono):
# gancho real do lead, sem link, uma pergunta simples e pedido de "com quem eu falo".
# Variáveis extras: {quem} (apresentação da dupla), {nota_boa}, {avaliacao} (frase curta de uma avaliação
# de 5 estrelas) e {arroba} (Instagram). A variação que usa uma delas só entra no sorteio se o lead tiver o dado.
# Apresentação da dupla (não cite a cidade de vocês): vai em toda primeira mensagem do Brasil.
quem: "Eu e o Felipe somos desenvolvedores de Campinas e região."

primeira:
  sem_site:
    - "Oi, {saudacao_minuscula}! Sou o Lucas. {quem} Procurei {nome} no Google e não achei site de vocês. Com quem eu falo sobre isso?"
    - "{saudacao}! Sou o Lucas. {quem} Quando alguém pesquisa por vocês no Google hoje, aparece só o mapa, sem site. Isso já foi assunto por aí? Quem cuida dessa parte?"
    - "Oi, {saudacao_minuscula}! Sou o Lucas. {quem} Tenho uma ideia simples pra {nome} aparecer melhor no Google. Posso explicar rápido pra quem decide isso aí?"
    - "Oi, {saudacao_minuscula}! Sou o Lucas. {quem} Vi vocês no Google com nota {nota_boa}, mas sem site. Já pensaram em ter um? Com quem eu falo?"
    - "{saudacao}! Sou o Lucas. {quem} Li o que um cliente escreveu de vocês no Google: “{avaliacao}”. Mas não achei site de vocês. Quem cuida disso aí?"
    - "{saudacao}! Sou o Lucas. {quem} Procurei {nome} no Google e não achei site. {dor} Faço um atendimento automático que resolve isso. Com quem falo?"
    - "Oi, {saudacao_minuscula}! Sou o Lucas. {quem} {dor} Hoje quem procura {nome} no Google não acha site, e isso piora. Posso explicar pra quem decide?"
    # Teste (2026-10): pergunta de sim ou não, compromisso menor que "com quem eu falo".
    - "Oi, {saudacao_minuscula}! Sou o Lucas. {quem} Posso te mandar um exemplo rápido de como ficaria um site pra {nome}, sem compromisso?"
    - "{saudacao}! Sou o Lucas. {quem} Vi vocês no Google com nota {nota_boa}, mas sem site. Posso te mostrar como ficaria o de vocês?"
    # Pedido do Lucas (2026-10-26): cumprimento, o que a dupla faz e exemplo grátis.
    - "{saudacao}, tudo bem? Sou o Lucas. {quem} Fazemos sites, que ajudam bastante nas buscas do Google, e bots de atendimento automático no WhatsApp. O exemplo não custa nada e é sem compromisso. Posso te mandar um pra {nome}?"
    # Teste (2026-10-28): quem decide + ideia rápida, sem pedir "com quem falo".
    - "{saudacao}! Sou o Lucas. {quem} {dor} Quem cuida do WhatsApp aí? Tenho uma ideia rápida pra mostrar, posso te mandar?"
  so_social:
    - "Oi, {saudacao_minuscula}! Sou o Lucas. {quem} Cheguei no Instagram de vocês pelo Google. Vocês têm site também ou só o Instagram mesmo?"
    - "{saudacao}! Sou o Lucas. {quem} Vi que {nome} divulga só pelas redes sociais. Já pensaram em ter um site próprio com botão de WhatsApp? Com quem eu falo sobre isso?"
    - "Oi, {saudacao_minuscula}! Sou o Lucas. {quem} Quem cuida da divulgação de vocês? Tenho uma ideia rápida pra quem procura vocês no Google cair direto no WhatsApp. Posso explicar pra quem decide?"
    - "Oi, {saudacao_minuscula}! Sou o Lucas. {quem} Vi o {arroba} de vocês, muito bom! Só não achei site. Já pensaram em ter um? Com quem eu falo?"
    - "{saudacao}! Sou o Lucas. {quem} Li uma avaliação de cliente de vocês no Google: “{avaliacao}”. Quem procura vocês só encontra rede social. Quem cuida disso aí?"
    - "{saudacao}! Sou o Lucas. {quem} Vi {nome} só nas redes sociais. {dor} Dá pra resolver com botão de WhatsApp e atendimento automático. Com quem falo?"
    # Teste (2026-10): pergunta de sim ou não.
    - "Oi, {saudacao_minuscula}! Sou o Lucas. {quem} Vi o Instagram de vocês. Posso te mandar um exemplo de como ficaria uma página com botão de WhatsApp pra {nome}?"
    - "{saudacao}! Sou o Lucas. {quem} Posso te mostrar rapidinho como um site simples, ligado ao WhatsApp, ficaria pra {nome}, sem compromisso?"
    # Pedido do Lucas (2026-10-26): cumprimento, o que a dupla faz e exemplo grátis.
    - "{saudacao}, tudo bem? Sou o Lucas. {quem} Fazemos sites, que ajudam bastante nas buscas do Google, e bots de atendimento automático no WhatsApp. O exemplo não custa nada e é sem compromisso. Posso te mandar um pra {nome}?"
    # Teste (2026-10-28): quem decide + ideia rápida, sem pedir "com quem falo".
    - "{saudacao}! Sou o Lucas. {quem} {dor} Quem cuida do WhatsApp aí? Tenho uma ideia rápida pra mostrar, posso te mandar?"
  tem_site:
    - "Oi, {saudacao_minuscula}! Sou o Lucas. {quem} Quando um cliente chama vocês no WhatsApp fora do horário, alguém responde ou fica pro dia seguinte?"
    - "{saudacao}! Sou o Lucas. {quem} Vi o site de vocês. O WhatsApp é por onde mais chega pedido ou contato? Faço atendimento automático que responde na hora. Posso explicar pra quem cuida disso?"
    - "Oi, {saudacao_minuscula}! Sou o Lucas. {quem} Alguém aí cuida do WhatsApp o dia todo ou o movimento é grande demais pra isso? Tenho uma ideia pra aliviar. Com quem falo sobre isso?"
    - "{saudacao}! Sou o Lucas. {quem} Li uma avaliação de cliente de vocês: “{avaliacao}”. Em dia cheio, dá conta de responder todo mundo no WhatsApp? Com quem falo sobre isso?"
    - "{saudacao}! Sou o Lucas. {quem} {dor} Faço atendimento automático que responde na hora e passa só o importante pra equipe. Posso explicar pra quem cuida disso?"
    - "Oi, {saudacao_minuscula}! Sou o Lucas. {quem} {dor} Tenho uma ideia simples pra isso. Com quem falo?"
    # Teste (2026-10): pergunta de sim ou não.
    - "Oi, {saudacao_minuscula}! Sou o Lucas. {quem} Posso te mandar um exemplo de atendimento automático no WhatsApp pra {nome}, que responde na hora e passa só o importante pra equipe?"
    - "{saudacao}! Sou o Lucas. {quem} Quer ver um exemplo de como o WhatsApp de {nome} responderia sozinho fora do horário?"
    # Pedido do Lucas (2026-10-26): cumprimento, o que a dupla faz e exemplo grátis.
    - "{saudacao}, tudo bem? Sou o Lucas. {quem} Fazemos bots de atendimento automático no WhatsApp e melhorias de site pra aparecer mais no Google. O exemplo não custa nada e é sem compromisso. Posso te mandar um pra {nome}?"
    # Teste (2026-10-28): quem decide + ideia rápida, sem pedir "com quem falo".
    - "{saudacao}! Sou o Lucas. {quem} {dor} Quem cuida do WhatsApp aí? Tenho uma ideia rápida pra mostrar, posso te mandar?"
  # Só para quem tem site sem botão de WhatsApp (sinal lido no site: sem_whatsapp).
  tem_site_sem_whatsapp:
    - "Oi, {saudacao_minuscula}! Sou o Lucas. {quem} Entrei no site de vocês e não achei botão de WhatsApp. Quem cuida do site? Tenho uma ideia simples pra isso."
    - "{saudacao}! Sou o Lucas. {quem} Quem chega no site de vocês e quer falar não acha um botão de WhatsApp. Posso mostrar como resolver em um dia. Com quem eu falo?"
    - "Oi, {saudacao_minuscula}! Sou o Lucas. {quem} Reparei que o site de vocês não tem botão pro WhatsApp. Já foi assunto por aí? Quem cuida disso?"
  # Lead indicado por um atendente (veio o contato de quem decide). {chamada} = ", Rafael" ou vazio.
  indicado:
    - "Oi{chamada}! Falei com a equipe de {indicador} e me passaram seu contato. Sou o Lucas. {quem} Quem cuida do site e do WhatsApp aí é você? Tenho uma ideia rápida pra mostrar."
    - "{saudacao}{chamada}! Sou o Lucas. {quem} A equipe de {indicador} me passou seu contato como responsável. Posso te falar rapidinho de uma ideia pra vocês?"
    - "Oi{chamada}! Sou o Lucas. {quem} Conversei com a equipe de {indicador} e disseram que é com você que se fala de site e atendimento no WhatsApp. É isso mesmo?"

  site_problema:
    - "Oi, {saudacao_minuscula}! Sou o Lucas. {quem} Tentei abrir o site de vocês e reparei que {problema}. Já sabiam? Com quem eu falo pra ajudar a resolver?"
    - "{saudacao}! Sou o Lucas. {quem} Passei pelo site de vocês e reparei que {problema}. Isso faz cliente desistir. Quem cuida do site?"
    - "Oi, {saudacao_minuscula}! Sou o Lucas. {quem} Um aviso rápido: reparei que {problema}. Posso ajudar a arrumar. Com quem falo sobre o site?"
    # Ângulo "refazer": sem preço, só a ideia de que às vezes compensa um site novo em vez de remendar o velho.
    - "Oi, {saudacao_minuscula}! Sou o Lucas. {quem} Reparei que {problema}. A gente refaz sites rápidos, que abrem bem no celular e já vêm com botão de WhatsApp. Posso te mostrar um exemplo? Com quem eu falo?"
    - "{saudacao}! Sou o Lucas. {quem} Vi que {problema}. Em vez de remendar, às vezes compensa refazer do zero, e a gente faz isso. Quem cuida do site de vocês?"

followup:
  - "Oi, {saudacao_minuscula}! Passando só pra saber se minha mensagem chegou. Se não for com você, me indica quem cuida disso por aí?"
  - "{saudacao}! Sei que a rotina aí é corrida, então sem pressa. Se tiver alguém que cuida do site ou do WhatsApp, me passa o contato que eu falo direto com a pessoa?"
  - "Oi! Último recado, prometo: não vou insistir. Se um dia quiserem ver o que eu faço, está aqui: {portfolio} . Sucesso aí!"

# Segunda mensagem, enviada de 25 a 70 s depois da primeira (só para quem tem {portfolio}): o link do portfólio
# vai separado para a primeira ficar curta. Não sai se o lead responder ou pedir para parar nesse intervalo.
portfolio_msg:
  - "Pra você ter uma ideia do meu trabalho, dá uma olhada no portfólio da gente: {portfolio}"
  - "Se quiser ver o que eu e o Felipe fazemos, o portfólio é este: {portfolio}"
  - "Deixo aqui o portfólio, pra darem uma olhada com calma: {portfolio}"

fora_do_horario:
  - "Oi! Obrigado pela resposta. Agora estou fora do horário, mas te respondo no próximo horário útil, combinado?"
  - "Opa, valeu por responder! Já encerrei por hoje, mas te retorno no próximo horário útil, tudo bem?"
  - "Recebi sua mensagem, obrigado! Estou fora do horário agora, mas retorno no próximo horário comercial."

# Cobrança educada de parcela vencida (vai para a fila de aprovação).
cobranca:
  - "Oi, tudo bem? Passando pra lembrar da parcela \"{descricao}\" de {valor}, que venceu em {vencimento}. Segue o Pix copia e cola:\n{pix}\nSe já pagou, desconsidera, tá? Obrigado!"
  - "{saudacao}! Só um lembrete da parcela \"{descricao}\" ({valor}, vencimento {vencimento}). O Pix copia e cola é este:\n{pix}\nQualquer coisa me avisa."
  - "Oi! Tudo certo por aí? Ficou em aberto a parcela \"{descricao}\" de {valor} (venceu {vencimento}). Pra facilitar, o Pix:\n{pix}\nSe tiver algum imprevisto, me fala que a gente combina."
