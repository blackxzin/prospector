# Templates de mensagem do prospector. Edite à vontade.
#
# Variáveis disponíveis em qualquer texto:
#   {saudacao}   "Bom dia" / "Boa tarde" / "Boa noite" (pelo horário local); {saudacao_minuscula} idem, minúsculo
#   {nome}       nome do negócio, limpo (sem " - Delivery", " | Centro" etc.)
#   {remetente}  seu nome (definido abaixo; também assina a proposta em PDF)
#   {apresentacao} frase que apresenta vocês (definida abaixo)
#   {portfolio}  link do portfólio (definido abaixo)
#   {elogio}     frase sobre a nota no Google (ou frase neutra, se não houver nota boa)
#   {nota}       ex.: 4,7          {avaliacoes}  ex.: 132
#   {vitrine}    "o cardápio" / "os planos e horários" / "os serviços" (pela categoria)
#   {problema}   (só em site_problema) ex.: "o site está fora do ar"
#   {valor} {vencimento} {descricao} {pix}   (só em cobranca)
#
# Teste A/B: cada variação de "primeira" é medida (taxa de resposta positiva) e as que
# funcionam melhor passam a ser sorteadas com mais frequência. Ver em `prospector ab`.
#
# Dica: evite artigo antes de {nome} ("o {nome}", "a {nome}"): não dá para saber o gênero.
# Use o nome no vocativo ("{saudacao}, {nome}!") ou sem artigo.

remetente: "Lucas"
portfolio: "https://portifolio-dupla.vercel.app"
apresentacao: "Eu e o Felipe somos desenvolvedores aqui da região e fazemos sites, automações e bots de atendimento para WhatsApp. Dá pra ver nossos trabalhos em {portfolio}."

# Nota mínima e número mínimo de avaliações para elogiar a nota.
elogio_nota_minima: 4.0
elogio_avaliacoes_minimas: 10

elogios_com_nota:
  - "Vocês têm nota {nota} com {avaliacoes} avaliações no Google, mandaram bem!"
  - "{nota} de nota e {avaliacoes} avaliações no Google não é pouca coisa, parabéns."
  - "Achei vocês no Google Maps, nota {nota} com {avaliacoes} avaliações, muito bom."

elogios_sem_nota:
  - "Achei vocês no Google Maps."
  - "Encontrei vocês pelo Google Maps."
  - "Vi o perfil de vocês no Google Maps."

vitrine:
  padrao: "os serviços"
  por_categoria:
    # barbearia antes da comida: "bar" da lista de comida casaria com "barbearia"
    - palavras: [salão, salao, barbearia, beleza, estética, estetica, manicure, cabeleireiro, sobrancelha]
      texto: "os serviços e preços"
    - palavras: [pizza, restaurante, lanch, hamburg, esfih, burger, açaí, acai, sorvete, padaria, confeitaria, doceria, bar, café, cafe, marmita, comida, delivery, esfiha, sushi, japon, churrasc, pastel]
      texto: "o cardápio"
    - palavras: [academia, fitness, crossfit, pilates, musculação, musculacao, studio, estúdio, funcional, natação, natacao, luta, jiu, muay]
      texto: "os planos e horários"
    - palavras: [loja, cosmético, cosmetico, roupa, moda, calçado, calcado, presente, papelaria, ótica, otica, pet shop]
      texto: "os produtos"

primeira:
  sem_site:
    - "{saudacao}, {nome}! Meu nome é {remetente}. {apresentacao} {elogio} Dei uma olhada e não encontrei um site de vocês. Se ainda não tiverem, montamos um simples, com {vitrine} e um botão que abre direto o WhatsApp. Teriam interesse em ver um exemplo, sem compromisso?"
    - "{saudacao}! Tudo bem? Aqui é o {remetente}. {apresentacao} {elogio} Procurei um site de vocês e não achei. Caso ainda não tenham, fazemos uma página rápida com {vitrine} e botão de WhatsApp. Posso te mandar um exemplo, sem compromisso?"
    - "Oi, {nome}, {saudacao_minuscula}! Sou o {remetente}. {apresentacao} {elogio} Não encontrei um site de vocês no Google. Se não tiverem, fazemos um bem simples, com {vitrine} e um botão pro WhatsApp. Teriam interesse em ver um exemplo?"
  so_social:
    - "{saudacao}, {nome}! Meu nome é {remetente}. {apresentacao} {elogio} Dei uma olhada e só encontrei a rede social de vocês, não um site próprio. Se ainda não tiverem, montamos uma página simples, com {vitrine} e um botão que abre o WhatsApp. Teriam interesse em ver um exemplo, sem compromisso?"
    - "{saudacao}! Tudo bem? Aqui é o {remetente}. {apresentacao} {elogio} Procurei um site de vocês e só achei o Instagram. Caso não tenham, fazemos um site simples com {vitrine} e botão de WhatsApp, que ajuda a aparecer no Google. Posso te mandar um exemplo?"
    - "Oi, {nome}, {saudacao_minuscula}! Sou o {remetente}. {apresentacao} {elogio} Não encontrei um site próprio de vocês, só rede social. Se não tiverem, montamos uma página rápida com {vitrine} e um botão pro WhatsApp. Teriam interesse em ver um exemplo?"
  tem_site:
    - "{saudacao}, {nome}! Meu nome é {remetente}. {apresentacao} {elogio} Vi que vocês já têm site, legal! Montamos um bot de atendimento no WhatsApp que responde as dúvidas comuns, mostra {vitrine} e passa os pedidos pra vocês. Posso te mandar um exemplo, sem compromisso?"
    - "{saudacao}! Tudo bem? Aqui é o {remetente}. {apresentacao} {elogio} Um bot de atendimento no WhatsApp faz ninguém ficar sem resposta no horário de pico. Teriam interesse em ver um exemplo funcionando, sem compromisso?"
    - "Oi, {nome}, {saudacao_minuscula}! Sou o {remetente}. {apresentacao} {elogio} Fazemos automação do WhatsApp: mensagem de boas-vindas, respostas prontas e encaminhamento dos pedidos pra vocês. Posso te mandar um exemplo, sem compromisso?"

  site_problema:
    - "{saudacao}, {nome}! Meu nome é {remetente}. {apresentacao} {elogio} Fui abrir o site de vocês e reparei que {problema}. Isso faz cliente desistir antes de pedir. A gente arruma isso ou faz um novo, simples e rápido, com {vitrine} e botão de WhatsApp. Posso te mandar um exemplo, sem compromisso?"
    - "{saudacao}! Tudo bem? Aqui é o {remetente}. {apresentacao} {elogio} Tentei acessar o site de vocês e {problema}. Como muita gente procura pelo Google antes, vale a pena resolver. Posso te mandar um exemplo, sem compromisso?"
    - "Oi, {nome}, {saudacao_minuscula}! Sou o {remetente}. {apresentacao} {elogio} Um aviso rápido: {problema}. Fazemos um site novo, leve, com {vitrine} e botão pro WhatsApp. Posso te mandar um exemplo, sem compromisso?"

followup:
  - "Oi, {nome}! Passando só pra saber se viu minha mensagem. Se quiser conhecer nosso trabalho antes, está em {portfolio}. Se não fizer sentido agora, tudo bem, é só me falar. Posso te mandar o exemplo?"
  - "{saudacao}! Sei que a rotina é corrida, por isso volto só mais esta vez. Quer que eu te mande o exemplo, sem compromisso?"
  - "Oi de novo, {nome}! Não quero incomodar, é o último recado. Se tiver interesse em ver o exemplo, me avisa por aqui?"

fora_do_horario:
  - "Oi! Obrigado pela resposta. Agora estou fora do horário, mas te respondo no próximo horário útil, combinado?"
  - "Opa, valeu por responder! Já encerrei por hoje, mas te retorno no próximo horário útil, tudo bem?"
  - "Recebi sua mensagem, obrigado! Estou fora do horário agora, mas retorno no próximo horário comercial."

# Cobrança educada de parcela vencida (vai para a fila de aprovação).
cobranca:
  - "Oi, tudo bem? Passando pra lembrar da parcela \"{descricao}\" de {valor}, que venceu em {vencimento}. Segue o Pix copia e cola:\n{pix}\nSe já pagou, desconsidera, tá? Obrigado!"
  - "{saudacao}! Só um lembrete da parcela \"{descricao}\" ({valor}, vencimento {vencimento}). O Pix copia e cola é este:\n{pix}\nQualquer coisa me avisa."
  - "Oi! Tudo certo por aí? Ficou em aberto a parcela \"{descricao}\" de {valor} (venceu {vencimento}). Pra facilitar, o Pix:\n{pix}\nSe tiver algum imprevisto, me fala que a gente combina."
