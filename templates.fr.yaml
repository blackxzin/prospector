# Textos em francês (França, Quebec, Suíça francófona). Sobrescreve o templates.yaml (pt).
idioma: fr
decimal: ","
apresentacao: "Je suis développeur brésilien et, avec mon associé Felipe, nous créons des sites web, des automatisations et des bots de service client pour WhatsApp."
portfolio: ""
optout: "(Répondez STOP et je ne vous écrirai plus.)"
problema_padrao: "il ne s'affichait pas correctement"
saudacoes: {manha: "Bonjour", tarde: "Bonjour", noite: "Bonsoir"}

elogios_com_nota:
  - "Une note de {nota} avec {avaliacoes} avis sur Google, c'est impressionnant, félicitations."
  - "Vous avez {nota} étoiles et {avaliacoes} avis sur Google, bravo !"
  - "Je vous ai trouvés sur Google Maps, {nota} de moyenne et {avaliacoes} avis, beau travail."
elogios_sem_nota:
  - "Je vous ai trouvés sur Google Maps."
  - "J'ai vu votre fiche Google Maps."
  - "Je suis tombé sur votre établissement sur Google Maps."

vitrine:
  padrao: "vos services"
  por_categoria:
    - palavras: [coiffeur, coiffure, barbier, salon, beaute, esthetique, ongle, manucure, spa, cosmet, cils, tatou]
      texto: "vos services et tarifs"
    - palavras: [pizza, restaurant, burger, cafe, boulanger, patisserie, glacier, bar, brasserie, traiteur, sushi, snack, creperie, bistro]
      texto: "votre carte"
    - palavras: [salle de sport, fitness, crossfit, pilates, yoga, boxe, danse, arts martiaux]
      texto: "vos cours et horaires"
    - palavras: [boutique, magasin, vetement, animalerie, fleuriste, cadeaux]
      texto: "vos produits"

# Abordagem curta: gancho real do lead, uma pergunta simples e pedido de "com quem falo". Sem link e sem preço.
primeira:
  sem_site:
    - "{saudacao}. Je suis Lucas, développeur brésilien. J'ai cherché {nome} sur Google et je n'ai pas trouvé de site. Avec qui puis-je en parler ? {optout}"
    - "Bonjour, Lucas, développeur. Quand on cherche votre établissement sur Google, on ne voit que la fiche, sans site. Est-ce un sujet pour vous ? Qui s'en occupe ? {optout}"
    - "{saudacao}. Je suis Lucas, développeur brésilien. J'ai une idée simple pour que {nome} apparaisse mieux sur Google. Puis-je l'expliquer rapidement à la personne qui décide ? {optout}"
    - "Bonjour, je suis Lucas, développeur brésilien. Je vous ai trouvés sur Google avec une note de {nota_boa}, mais sans site. Y avez-vous déjà pensé ? Avec qui puis-je en parler ? {optout}"
    - "{saudacao}. Je suis Lucas, développeur brésilien. J'ai lu ce qu'un client a écrit sur vous sur Google : « {avaliacao} ». Mais je n'ai pas trouvé de site. Qui s'en occupe ? {optout}"
  so_social:
    - "{saudacao}. Je suis Lucas, développeur brésilien. Je suis arrivé sur vos réseaux sociaux via Google. Avez-vous aussi un site, ou seulement les réseaux ? {optout}"
    - "Bonjour, Lucas, développeur. J'ai vu que {nome} ne communique que sur les réseaux sociaux. Avez-vous pensé à un site simple avec un bouton WhatsApp ? Avec qui puis-je en parler ? {optout}"
    - "{saudacao}. Je suis Lucas, développeur brésilien. Qui s'occupe de votre communication ? J'ai une idée rapide pour que ceux qui vous cherchent sur Google arrivent directement sur WhatsApp. Puis-je l'expliquer à la personne qui décide ? {optout}"
    - "Bonjour, je suis Lucas, développeur brésilien. J'ai vu votre {arroba}, très bien ! Mais pas de site. Y avez-vous pensé ? Avec qui puis-je en parler ? {optout}"
    - "{saudacao}. Je suis Lucas, développeur brésilien. J'ai lu un avis client sur Google : « {avaliacao} ». Qui vous cherche ne trouve que des réseaux sociaux. Qui s'en occupe ? {optout}"
  tem_site:
    - "{saudacao}. Je suis Lucas, développeur brésilien. Quand un client vous écrit sur WhatsApp en dehors des horaires, quelqu'un répond-il ou cela attend-il le lendemain ? {optout}"
    - "Bonjour, Lucas, développeur. J'ai vu votre site. WhatsApp est-il le principal canal de contact ? Je crée des réponses automatiques instantanées. Puis-je l'expliquer à la personne concernée ? {optout}"
    - "{saudacao}. Je suis Lucas, développeur brésilien. Quelqu'un gère-t-il WhatsApp toute la journée, ou y a-t-il trop de monde pour cela ? J'ai une idée pour alléger. Avec qui puis-je en parler ? {optout}"
    - "{saudacao}. Je suis Lucas, développeur brésilien. J'ai lu un avis client : « {avaliacao} ». Les jours de forte affluence, arrivez-vous à répondre à tout le monde sur WhatsApp ? Avec qui puis-je en parler ? {optout}"
  site_problema:
    - "{saudacao}. Je suis Lucas, développeur brésilien. J'ai essayé d'ouvrir votre site et {problema}. Le saviez-vous ? Avec qui puis-je en parler pour le corriger ? {optout}"
    - "Bonjour, Lucas, développeur. Je suis passé sur votre site et {problema}. Les clients abandonnent. Qui s'occupe du site ? {optout}"
    - "{saudacao}. Je suis Lucas, développeur brésilien. Petite alerte : en ouvrant votre site, {problema}. Je peux aider à le corriger. Avec qui puis-je en parler ? {optout}"

followup:
  - "Bonjour. Je voulais juste savoir si mon message vous est bien parvenu. Si ce n'est pas vous, pourriez-vous m'indiquer qui s'en occupe ? {optout}"
  - "{saudacao}. Je sais que c'est chargé. Si quelqu'un s'occupe de votre site ou de WhatsApp, pourriez-vous me donner son contact pour que je lui parle directement ? {optout}"
  - "Bonjour. Dernier message, je n'insiste pas. Si un jour vous voulez voir ce que je fais, écrivez-moi ici. Bonne continuation ! {optout}"

fora_do_horario:
  - "Bonjour ! Merci pour votre réponse. Je suis hors horaires pour le moment, mais je vous réponds le prochain jour ouvré."
  - "Merci d'avoir répondu ! J'ai terminé pour aujourd'hui, mais je reviens vers vous le prochain jour ouvré."
  - "J'ai bien reçu votre message, merci. Je suis absent pour l'instant et je réponds le prochain jour ouvré."
