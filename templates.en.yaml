# Textos em inglês (EUA, Canadá, Reino Unido, Irlanda, Países Baixos). Sobrescreve o templates.yaml (pt).
idioma: en
decimal: "."
apresentacao: "I'm a developer from Brazil and, together with my partner Felipe, I build websites, automations and customer-service bots for WhatsApp."
portfolio: ""
optout: "(Reply STOP and I won't message again.)"
problema_padrao: "it didn't load properly"
saudacoes: {manha: "Good morning", tarde: "Good afternoon", noite: "Good evening"}

elogios_com_nota:
  - "{nota} stars across {avaliacoes} Google reviews is impressive, congratulations."
  - "You have a {nota} rating with {avaliacoes} reviews on Google, well done!"
  - "Found you on Google Maps, {nota} stars and {avaliacoes} reviews, great work."
elogios_sem_nota:
  - "I found you on Google Maps."
  - "I came across your Google Maps profile."
  - "I had a look at your profile on Google Maps."

vitrine:
  padrao: "your services"
  por_categoria:
    - palavras: [barber, hair, salon, beauty, nail, spa, cosmetic, lash, brow, tattoo]
      texto: "your services and prices"
    - palavras: [pizza, restaurant, burger, cafe, coffee, bakery, ice cream, food, diner, grill, sushi, taco, bbq, bar, pub, deli, bistro, truck]
      texto: "your menu"
    - palavras: [gym, fitness, crossfit, pilates, yoga, martial, boxing, studio, dance]
      texto: "your classes and schedule"
    - palavras: [store, shop, boutique, clothing, pet, florist, gift]
      texto: "your products"

# Abordagem curta: gancho real do lead, uma pergunta simples e pedido de "com quem falo". Sem link e sem preço.
primeira:
  sem_site:
    - "{saudacao}! This is Lucas, a developer from Brazil. I searched for {nome} on Google and couldn't find a website. Who's the right person to talk to about that? {optout}"
    - "Hi! Lucas here, a web developer. When people search for you on Google right now, they only get the map listing, no website. Has that come up before? Who handles this side? {optout}"
    - "{saudacao}, I'm Lucas, a developer from Brazil. I have a simple idea to help {nome} show up better on Google. Can I explain it quickly to whoever makes these decisions? {optout}"
    - "Hi! Lucas here, a developer from Brazil. I found you on Google with a {nota_boa} rating but no website. Ever thought about having one? Who should I talk to? {optout}"
    - "{saudacao}! I'm Lucas, a developer from Brazil. I read what a customer wrote about you on Google: “{avaliacao}”. I couldn't find a website for you though. Who handles that? {optout}"
  so_social:
    - "{saudacao}! This is Lucas, a developer from Brazil. I found your social media page through Google. Do you also have a website, or is it just social media? {optout}"
    - "Hi! Lucas here, a developer. I noticed {nome} only promotes on social media. Ever thought about a simple website with a WhatsApp button? Who should I talk to about that? {optout}"
    - "{saudacao}, I'm Lucas, a developer from Brazil. Who handles your marketing? I have a quick idea so people who search for you on Google land straight in your WhatsApp. Can I explain it to whoever decides? {optout}"
    - "Hi! Lucas here, a developer from Brazil. I saw your {arroba}, nice work! I couldn't find a website though. Ever thought about one? Who should I talk to? {optout}"
    - "{saudacao}! I'm Lucas, a developer from Brazil. I read a customer review of you on Google: “{avaliacao}”. People who search for you only find social media. Who handles that? {optout}"
  tem_site:
    - "{saudacao}! This is Lucas, a developer from Brazil. When a customer messages you on WhatsApp outside opening hours, does someone answer or does it wait until the next day? {optout}"
    - "Hi! Lucas here, a developer. I saw your website. Is WhatsApp where most inquiries come in? I build automatic replies that answer instantly. Can I explain it to whoever handles that? {optout}"
    - "{saudacao}, I'm Lucas, a developer from Brazil. Does someone handle WhatsApp all day, or is it too busy for that? I have an idea to lighten the load. Who should I talk to? {optout}"
    - "{saudacao}! I'm Lucas, a developer from Brazil. I read a customer review of you: “{avaliacao}”. On a busy day, can you keep up with every WhatsApp message? Who should I talk to about this? {optout}"
  site_problema:
    - "{saudacao}! This is Lucas, a developer from Brazil. I tried to open your website and {problema}. Did you know? Who should I talk to about fixing it? {optout}"
    - "Hi! Lucas here, a developer. I visited your website and {problema}. That makes customers give up. Who handles the site? {optout}"
    - "{saudacao}, I'm Lucas, a developer from Brazil. Quick heads-up: when I opened your website, {problema}. I can help fix it. Who should I talk to? {optout}"

followup:
  - "Hi! Just checking my message got through. If it's not you, could you point me to whoever handles this? {optout}"
  - "{saudacao}! I know it's busy. If someone looks after your website or WhatsApp, could you share their contact so I can talk to them directly? {optout}"
  - "Hi! Last note, I won't push. If you ever want to see what I do, just message me here. Wishing you all the best! {optout}"

fora_do_horario:
  - "Hi! Thanks for your reply. I'm offline right now, but I'll get back to you on the next business day."
  - "Thanks for getting back to me! I'm done for today, but I'll reply on the next business day."
  - "Got your message, thank you! I'm away at the moment and will answer on the next business day."
